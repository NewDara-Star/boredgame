<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8FDBFF" /> <!-- brand-ok: the status bar needs a literal; midday sky top -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BoredGame" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400..800&family=Bagel+Fat+One&display=swap" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BoredGame</title>
  </head>
  <body>
    <!-- The launch (F1): drawn before any code arrives, so a member never sees the
         signed-out screens while the saved login is read. The sky follows the
         clock (BRAND.md rule 4), the flower wakes and turns to you, seeds fill in.
         The app fades it out (src/app/launch.ts) the moment it knows who you are.
         No minimum time. -->
    <style>
      #launch{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;
        background:linear-gradient(180deg,var(--l1,#8FDBFF) 0%,var(--l2,#3FAEFF) 45%,var(--l3,#1F8BF0) 100%); /* brand-ok: launch drawn before the code loads (tokens: sky midday, ink) */
        transition:opacity .2s ease-out}
      #launch.l-out{opacity:0;pointer-events:none}
      #launch .l-seeds{position:absolute;inset:0 0 auto 0;width:100%;height:60vh}
      #launch .l-seeds circle{fill:#fff;opacity:0;animation:l-seed .3s ease-out forwards} /* brand-ok: launch drawn before the code loads (tokens: sky midday, ink) */
      #launch .l-flower{position:relative;width:min(44vw,190px);aspect-ratio:100/104;
        transform-origin:50% 90%;animation:l-perk .9s cubic-bezier(.45,0,.25,1) .15s both}
      #launch .l-f{position:absolute;inset:0;width:100%;height:auto;display:block;overflow:visible}
      #launch .l-awake{opacity:0;animation:l-wake .12s linear .15s forwards}
      #launch .l-sleep{animation:l-sleep .12s linear .15s forwards}
      #launch .l-slow{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:16px;right:16px;
        text-align:center;font:600 14px/1.4 system-ui,sans-serif;color:#231A3D;opacity:0;transition:opacity .4s} /* brand-ok: launch drawn before the code loads (tokens: sky midday, ink) */
      #launch.l-late .l-slow{opacity:1}
      html[data-sky=night] #launch .l-slow{color:#fff} /* brand-ok: launch drawn before the code loads (tokens: sky midday, ink) */
      @keyframes l-perk{from{transform:rotate(-26deg) translateY(14%) scale(.9)}to{transform:none}}
      @keyframes l-wake{to{opacity:1}}
      @keyframes l-sleep{to{opacity:0}}
      @keyframes l-seed{to{opacity:.16}}
      @media (prefers-reduced-motion:reduce){
        #launch .l-flower,#launch .l-seeds circle{animation:none}
        #launch .l-seeds circle{opacity:.16}
        #launch .l-awake{animation:none;opacity:1}#launch .l-sleep{animation:none;opacity:0}
      }
    </style>

    <script>
      // The same sky as the app's (tokens.ts SKIES / skyAt), and the seed spiral
      // (each seed 137.5 degrees round from the last), before the app's code loads.
      (function () {
        var h = new Date().getHours() + new Date().getMinutes() / 60;
        var sky = h >= 5 && h < 11 ? ["morning", "#FFE3B8", "#A8DDFF", "#6CC4FF"] // brand-ok: tokens.ts SKIES, before the code loads (check-launch)
          : h >= 11 && h < 17 ? ["midday", "#8FDBFF", "#3FAEFF", "#1F8BF0"] // brand-ok: tokens.ts SKIES, before the code loads (check-launch)
          : h >= 17 && h < 20 ? ["golden", "#FFC27A", "#FF8A5C", "#B55BD6"] // brand-ok: tokens.ts SKIES, before the code loads (check-launch)
          : ["night", "#2A2466", "#1D1A52", "#120F36"]; // brand-ok: tokens.ts SKIES, before the code loads (check-launch)
        var el = document.getElementById("launch");
        document.documentElement.dataset.sky = sky[0];
        el.style.setProperty("--l1", sky[1]); el.style.setProperty("--l2", sky[2]); el.style.setProperty("--l3", sky[3]);
        var svg = el.querySelector(".l-seeds"), ns = "http://www.w3.org/2000/svg";
        for (var k = 1; k <= 260; k++) {
          var a = k * 2.39996, r = 13 * Math.sqrt(k), c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", (50 + r * Math.cos(a)).toFixed(1)); c.setAttribute("cy", (18 + r * Math.sin(a)).toFixed(1));
          c.setAttribute("r", (0.8 + 3.4 * k / 260).toFixed(1));
          c.style.animationDelay = (0.3 + k * 0.003).toFixed(3) + "s";
          svg.appendChild(c);
        }
        // Nothing has taken it away after 8 s: say why the wait, rather than a
        // flower that looks stuck.
        setTimeout(function () { el.classList.add("l-late"); }, 8000);
      })();
    </script>
